appId: com.the-office.app
productName: Session Tray
# No native modules; skipping rebuild also stops electron-builder from pruning the shared workspace node_modules.
npmRebuild: false
directories:
  output: dist-electron
# Paths are relative to desktop/ (the app dir). The renderer lives outside it, so it ships as an extra resource.
files:
  - dist/**
  - "!dist/**/__tests__/**"
  - assets/**
  - package.json
extraResources:
  - from: ../client/dist
    to: client/dist
mac:
  category: public.app-category.developer-tools
  target: dmg
win:
  target: nsis
linux:
  target: AppImage
publish:
  provider: github
  owner: Resip10
  repo: the-office
